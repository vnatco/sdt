<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314" width="164" height="314">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#2B2735"/>
      <stop offset="1" stop-color="#0B0A0F"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#FF6A4D" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FF6A4D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" gradientUnits="userSpaceOnUse" x1="120" y1="70" x2="40" y2="150">
      <stop offset="0" stop-color="#FFC75F"/>
      <stop offset="0.5" stop-color="#FF7A4F"/>
      <stop offset="1" stop-color="#F2416B"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="164" height="314" fill="url(#bg)"/>
  <rect width="164" height="314" fill="url(#warm)"/>
  <!-- Dial ticks around the mark. -->
  <g stroke="#FFFFFF" stroke-linecap="round">
    <g stroke-opacity="0.16" stroke-width="1.2">
      <line x1="82" y1="38" x2="82" y2="43" transform="rotate(0 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(30 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(60 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(90 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(120 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(150 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(180 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(210 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(240 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(270 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(300 82 112)"/><line x1="82" y1="38" x2="82" y2="43" transform="rotate(330 82 112)"/>
    </g>
  </g>
  <!-- The app mark: a power symbol whose ring is a timer. -->
  <path d="M 106.1 73.2 A 46 46 0 1 1 57.9 73.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="13" stroke-linecap="round"/>
  <path d="M 106.1 73.2 A 46 46 0 1 1 38.8 127.7" fill="none" stroke="url(#arc)" stroke-width="13" stroke-linecap="round" filter="url(#glow)" opacity="0.8"/>
  <path d="M 106.1 73.2 A 46 46 0 1 1 38.8 127.7" fill="none" stroke="url(#arc)" stroke-width="13" stroke-linecap="round"/>
  <rect x="75.5" y="52" width="13" height="56" rx="6.5" fill="#FFFFFF"/>
  <!-- A soft horizon of rings below. -->
  <g fill="none" stroke="#FF7A4F">
    <circle cx="82" cy="430" r="150" stroke-opacity="0.10"/>
    <circle cx="82" cy="430" r="175" stroke-opacity="0.07"/>
    <circle cx="82" cy="430" r="200" stroke-opacity="0.05"/>
  </g>
</svg>
