[package]
name = "shut-down-timer"
version = "1.0.0"
description = "A small, good-looking timer that shuts down, restarts or sleeps your computer"
authors = ["Vladimer Natchkepia"]
license = "Apache-2.0"
repository = "https://github.com/vnatco/sdt"
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows (rust-lang/cargo#8519).
name = "sdt_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
log = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Shutdown",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
